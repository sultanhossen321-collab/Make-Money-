<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;font-family:Arial,sans-serif;color:#17212b}.header{background:#172938;color:white;padding:20px;font-size:24px;font-weight:bold}.container{padding:18px}.card{background:white;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px rgba(0,0,0,.08)}.title{font-size:22px;font-weight:bold;margin-bottom:15px}.stat{font-size:28px;font-weight:bold}.submission{border:1px solid #e0e5e9;border-radius:14px;padding:16px;margin-top:12px}.status{display:inline-block;padding:7px 10px;border-radius:8px;background:#fff3cd;color:#856404;font-weight:bold;margin-top:8px}button{border:0;border-radius:11px;padding:12px;color:white;font-size:15px;font-weight:bold;margin-top:10px}.approve{background:#198754}.reject{background:#dc3545;margin-left:6px}</style>
</head>
<body>
<div class="header">👨‍💼 Admin Panel</div>
<div class="container">
<div class="card"><div class="title">📊 Dashboard</div><p>Pending Submissions</p><div class="stat" id="pendingCount">1</div><p>Total Users</p><div class="stat">1</div></div>
<div class="card"><div class="title">📋 Pending Submissions</div>
<div class="submission"><b>📩 Email Verification Task</b><p>User ID: Demo User</p><p>Submission: Demo submission</p><span class="status">⏳ Pending</span><br><button class="approve" onclick="approveTask(this)">✅ Approve</button><button class="reject" onclick="rejectTask(this)">❌ Reject</button></div>
</div></div>
<script>
let pending=1;
function finish(b,text,bg,fg){const x=b.closest('.submission');const s=x.querySelector('.status');s.innerText=text;s.style.background=bg;s.style.color=fg;x.querySelectorAll('button').forEach(e=>e.remove());pending--;document.getElementById('pendingCount').innerText=pending;}
function approveTask(b){finish(b,'✅ Approved','#d4edda','#155724')}
function rejectTask(b){finish(b,'❌ Rejected','#f8d7da','#721c24')}
</script>
</body>
</html>
