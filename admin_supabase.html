<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make Money Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>body{margin:0;background:#f5f6fa;font-family:Arial,"Noto Sans Bengali",sans-serif;color:#17202a}.head{background:#5416b8;color:#fff;padding:18px;font-size:22px;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:17px;margin:14px 0;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{padding:15px;border:1px solid #eee;border-radius:14px}.stat b{display:block;font-size:25px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #dfe3e8;border-radius:10px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:800}.ok{background:#10c98a;color:#fff}.bad{background:#e84b5b;color:#fff}.purple{background:#6d25dc;color:#fff}.row{border-top:1px solid #eee;padding:12px 0}</style></head><body><div class="head">👨‍💼 Make Money Admin</div><div class="wrap" id="app">Loading...</div>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function init(){const s=(await db.auth.getSession()).data.session;if(!s){login();return}const a=await db.from("admin_users").select("*").eq("user_id",s.user.id).maybeSingle();if(!a.data){app.innerHTML='<div class=card>এই account admin নয়।</div>';return}dash()}
function login(){app.innerHTML='<div class=card><h2>Admin Login</h2><input id=e placeholder="Email"><input id=p type=password placeholder="Password"><button class=purple onclick=doLogin()>Login</button></div>'}
async function doLogin(){const r=await db.auth.signInWithPassword({email:e.value,password:p.value});if(r.error)return alert(r.error.message);location.reload()}
async function dash(){
 const [u,t,s,w,set]=await Promise.all([db.from("profiles").select("*"),db.from("tasks").select("*").order("sort_order"),db.from("task_submissions").select("*,tasks(title),profiles(telegram_id,first_name)"),db.from("withdrawals").select("*,profiles(telegram_id,first_name)"),db.from("settings").select("*")]);
 const settings={};(set.data||[]).forEach(x=>settings[x.key]=x);
 app.innerHTML=`<div class=grid><div class=stat>Users<b>${u.data?.length||0}</b></div><div class=stat>Tasks<b>${t.data?.length||0}</b></div><div class=stat>Pending Tasks<b>${s.data?.filter(x=>x.status==='pending').length||0}</b></div><div class=stat>Pending Withdrawals<b>${w.data?.filter(x=>x.status==='pending').length||0}</b></div></div>
 <div class=card><h2>⚙️ Settings</h2><input id=gs type=number step=0.01 value="${settings.gmail_task_reward?.value??15}" placeholder="Gmail reward"><input id=ar type=number step=0.01 value="${settings.ad_reward?.value??0.10}" placeholder="Ad reward"><input id=rr type=number step=0.01 value="${settings.referral_reward?.value??4}" placeholder="Referral reward"><input id=mw type=number step=0.01 value="${settings.minimum_withdraw?.value??250}" placeholder="Minimum withdraw"><button class=purple onclick=saveSettings()>Save Settings</button></div>
 <div class=card><h2>➕ New Task</h2><input id=tt placeholder="Title"><textarea id=td placeholder="Description"></textarea><textarea id=pi placeholder="Proof instruction"></textarea><input id=tr type=number step=0.01 placeholder="Reward"><input id=tl type=number placeholder="Daily limit"><button class=purple onclick=createTask()>Add Task</button></div>
 <div class=card><h2>📋 Tasks</h2>${(t.data||[]).map(x=>`<div class=row><b>${esc(x.title)}</b> — ৳${Number(x.reward).toFixed(2)} <button class=${x.active?'bad':'ok'} onclick=toggleTask('${x.id}',${!x.active})>${x.active?'Disable':'Enable'}</button></div>`).join("")}</div>
 <div class=card><h2>📝 Submissions</h2>${(s.data||[]).filter(x=>x.status==='pending').map(x=>`<div class=row><b>${esc(x.tasks?.title)}</b><p>User: ${esc(x.profiles?.telegram_id)}</p><p>${esc(x.proof_text||x.proof_url||'')}</p><button class=ok onclick=reviewTask('${x.id}','approved')>Approve</button> <button class=bad onclick=reviewTask('${x.id}','rejected')>Reject</button></div>`).join("")||'No pending submissions'}</div>
 <div class=card><h2>💸 Withdrawals</h2>${(w.data||[]).filter(x=>x.status==='pending').map(x=>`<div class=row><b>${esc(x.profiles?.telegram_id)}</b> — ৳${Number(x.amount).toFixed(2)}<p>${esc(x.payment_method)}: ${esc(x.payment_number)}</p><button class=ok onclick=reviewWithdraw('${x.id}','approved')>Approve & Deduct</button> <button class=bad onclick=reviewWithdraw('${x.id}','rejected')>Reject</button></div>`).join("")||'No pending withdrawals'}</div>`;
}
async function saveSettings(){for(const [key,val] of [['gmail_task_reward',gs.value],['ad_reward',ar.value],['referral_reward',rr.value],['minimum_withdraw',mw.value]]){const r=await db.from("settings").upsert({key,value:Number(val)},{onConflict:'key'});if(r.error)return alert(r.error.message)}alert('Settings saved');dash()}
async function createTask(){const r=await db.from("tasks").insert({title:tt.value,description:td.value,proof_instruction:pi.value,reward:Number(tr.value),daily_limit:tl.value?Number(tl.value):null,active:true});if(r.error)return alert(r.error.message);dash()}
async function toggleTask(id,a){const r=await db.from("tasks").update({active:a}).eq("id",id);if(r.error)alert(r.error.message);else dash()}
async function reviewTask(id,status){const fn=status==='approved'?'approve_task_submission':'reject_task_submission';const r=await db.rpc(fn,{p_submission_id:id,p_admin_note:null});if(r.error)alert(r.error.message);else dash()}
async function reviewWithdraw(id,status){const fn=status==='approved'?'approve_withdrawal':'reject_withdrawal';const r=await db.rpc(fn,{p_withdrawal_id:id,p_admin_note:null});if(r.error)alert(r.error.message);else dash()}
init();
</script></body></html>
