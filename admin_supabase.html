<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Maker Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#18213a;font-family:Arial,"Noto Sans Bengali","Hind Siliguri",sans-serif}.head{background:linear-gradient(135deg,#43109c,#7d27ed);color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:14px;background:#f6f2ff;border-radius:14px;text-align:center}.stat b{display:block;font-size:24px;color:#5d1bc7;margin-top:4px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#6b22d6;color:#fff}.ok{background:#0fb878;color:#fff}.bad{background:#dc3545;color:#fff}.gray{background:#eef0f5;color:#344}.muted{color:#69758b}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.item{border:1px solid #e7e9ef;border-radius:14px;padding:14px;margin:10px 0}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;color:#555;font-size:12px}.tag.pending{background:#fff2cc}.tag.approved{background:#dff7ea;color:#087044}.tag.rejected{background:#ffe4e4;color:#9c2222}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #d9dee8;border-radius:11px;margin:6px 0 12px}.hidden{display:none}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;background:#fff;border:1px solid #ddd}.tabs button.active{background:#6b22d6;color:#fff}.error{background:#ffe6e6;color:#9c2222;padding:12px;border-radius:12px;margin:10px 0}.success{background:#e2f8ed;color:#087044;padding:12px;border-radius:12px;margin:10px 0}.small{font-size:13px}.dangerText{color:#b02a37}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="head"><div class="wrap"><h1>👨‍💼 Money Maker Admin</h1><div id="who">Login required</div></div></div>
<main class="wrap">
<section id="login" class="card"><h2>Admin Login</h2><div class="form"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="primary" onclick="login()">Login</button><div id="loginMsg" class="error hidden" style="margin-top:10px"></div></div><p class="muted">Admin account দিয়ে লগইন করুন। Browser-এ secret/service-role key রাখা হয়নি।</p></section>
<section id="panel" class="hidden">
<div class="grid"><div class="stat">👥 Users<b id="users">0</b></div><div class="stat">📝 Pending Tasks<b id="pending">0</b></div><div class="stat">💸 Pending Withdraw<b id="wpending">0</b></div><div class="stat">💰 User Balance<b id="bal">৳0.00</b></div><div class="stat">👤 Referrals<b id="refs">0</b></div></div>
<div class="tabs">
<button class="active" onclick="tab('subs',this)">📋 Submissions</button><button onclick="tab('withdraws',this)">💸 Withdrawals</button><button onclick="tab('tasks',this)">📝 Tasks</button><button onclick="tab('users',this)">👥 Users</button><button onclick="tab('refs',this)">🔗 Referrals</button><button onclick="tab('settings',this)">⚙️ Settings</button>
</div><div id="content"></div><button class="bad" onclick="logout()">Logout</button>
</section></main>
<script>
const URL="https://cjfasocelwfvhhhghlma.supabase.co",KEY="sb_publishable_qYBMOJNal_V5ykKY6mcMzg_Oa-ASX7z";const db=supabase.createClient(URL,KEY);let tabName="subs";
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const money=v=>"৳"+Number(v||0).toFixed(2);
function msg(t,c){const x=document.createElement('div');x.className=c;x.textContent=t;document.querySelector('main').prepend(x);setTimeout(()=>x.remove(),3500)}
function showLoginMsg(text,kind='error'){const x=document.getElementById('loginMsg');x.className=kind;x.classList.remove('hidden');x.textContent=text} async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,btn=document.getElementById('loginBtn');if(!email||!password)return showLoginMsg('Email এবং Password দুটোই দিন।','error');btn.disabled=true;btn.textContent='Logging in...';showLoginMsg('Supabase Auth-এ login পরীক্ষা হচ্ছে...','success');try{const r=await db.auth.signInWithPassword({email,password});if(r.error){console.error(r.error);let d=r.error.message||'Unknown Auth error';if(d.toLowerCase().includes('invalid login credentials'))d='❌ Email অথবা Password ভুল।';else if(d.toLowerCase().includes('email not confirmed'))d='❌ Email এখনো confirmed নয়।';return showLoginMsg(d,'error')}if(!r.data.user)return showLoginMsg('❌ Auth user পাওয়া যায়নি।','error');const a=await db.from('admin_users').select('role').eq('user_id',r.data.user.id).maybeSingle();if(a.error){await db.auth.signOut();return showLoginMsg('❌ admin_users যাচাই করতে সমস্যা: '+a.error.message,'error')}if(!a.data){await db.auth.signOut();return showLoginMsg('❌ Auth login সফল, কিন্তু এই UID admin_users-এ নেই। UID: '+r.data.user.id,'error')}document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');document.getElementById('who').textContent=(r.data.user.email||email)+' • '+a.data.role;await load()}catch(e){console.error(e);showLoginMsg('❌ Login error: '+(e?.message||String(e)),'error')}finally{btn.disabled=false;btn.textContent='Login'}}
async function logout(){await db.auth.signOut();location.reload()}
async function load(){const [u,s,w,p,r]=await Promise.all([db.from('profiles').select('id,balance'),db.from('task_submissions').select('id,status'),db.from('withdrawals').select('id,status'),db.from('profiles').select('balance'),db.from('referrals').select('id')]);document.getElementById('users').textContent=(u.data||[]).length;document.getElementById('pending').textContent=(s.data||[]).filter(x=>x.status==='pending').length;document.getElementById('wpending').textContent=(w.data||[]).filter(x=>x.status==='pending').length;document.getElementById('bal').textContent=money((p.data||[]).reduce((a,x)=>a+Number(x.balance||0),0));document.getElementById('refs').textContent=(r.data||[]).length;render()}
function tab(x,b){tabName=x;document.querySelectorAll('.tabs button').forEach(e=>e.classList.remove('active'));b.classList.add('active');render()}
async function render(){const c=document.getElementById('content');c.innerHTML='Loading...';
if(tabName==='subs')return renderSubs(c);if(tabName==='withdraws')return renderWithdraws(c);if(tabName==='tasks')return renderTasks(c);if(tabName==='users')return renderUsers(c);if(tabName==='refs')return renderRefs(c);return renderSettings(c)}
async function renderSubs(c){const r=await db.from('task_submissions').select('*,profiles(telegram_id,username,first_name),tasks(title,reward)').order('created_at',{ascending:false}).limit(200);if(r.error)return c.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';c.innerHTML='<h2>📋 Task Submissions</h2>'+(r.data||[]).map(x=>`<div class="item"><div class="row"><b>${esc(x.tasks?.title||'Task')}</b><span class="tag ${esc(x.status)}">${esc(x.status)}</span></div><p>User: ${esc(x.profiles?.first_name||'')} • ${esc(x.profiles?.username||'')} • ID ${esc(x.profiles?.telegram_id||'')}</p><p>Proof: ${esc(x.proof_text||x.proof_url||'—')}</p><p>Reward: <b>${money(x.reward_snapshot)}</b></p><p class="small muted">${new Date(x.created_at).toLocaleString('bn-BD')}</p>${x.admin_note?`<p class="small">Admin note: ${esc(x.admin_note)}</p>`:''}${x.status==='pending'?`<button class="ok" onclick="reviewTask('${x.id}','approve')">✅ Approve</button> <button class="bad" onclick="reviewTask('${x.id}','reject')">❌ Reject</button>`:''}</div>`).join('')||'<p>কোনো submission নেই।</p>'}
async function renderWithdraws(c){const r=await db.from('withdrawals').select('*,profiles(telegram_id,username,first_name)').order('created_at',{ascending:false}).limit(200);if(r.error)return c.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';c.innerHTML='<h2>💸 Withdrawals</h2>'+(r.data||[]).map(x=>`<div class="item"><div class="row"><b>${money(x.amount)}</b><span class="tag ${esc(x.status)}">${esc(x.status)}</span></div><p>User: ${esc(x.profiles?.first_name||'')} • ID ${esc(x.profiles?.telegram_id||'')}</p><p>${esc(x.payment_method)} • ${esc(x.payment_number)}</p><p class="small muted">${new Date(x.created_at).toLocaleString('bn-BD')}</p>${x.admin_note?`<p>Note: ${esc(x.admin_note)}</p>`:''}${x.status==='pending'?`<button class="ok" onclick="reviewWithdraw('${x.id}','approve')">✅ Approve</button> <button class="bad" onclick="reviewWithdraw('${x.id}','reject')">❌ Reject</button>`:''}${x.status==='approved'?`<button class="primary" onclick="reviewWithdraw('${x.id}','paid')">💸 Mark Paid</button>`:''}</div>`).join('')||'<p>কোনো withdrawal নেই।</p>'}
async function renderTasks(c){const r=await db.from('tasks').select('*').order('sort_order');if(r.error)return c.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';c.innerHTML='<h2>📝 Task Management</h2><div class="card form"><h3>নতুন Task</h3><input id="tt" placeholder="Task title"><textarea id="td" placeholder="Description"></textarea><input id="tr" type="number" step="0.01" placeholder="Reward"><input id="tp" placeholder="Proof instruction"><button class="primary" onclick="addTask()">➕ Add Task</button></div>'+(r.data||[]).map(x=>`<div class="item"><div class="row"><b>${esc(x.title)}</b><span class="tag">${x.active?'Active':'Off'}</span></div><p>${esc(x.description||'')}</p><p>Reward: <b>${money(x.reward)}</b> • Proof: ${esc(x.proof_type||'text')}</p><button class="primary" onclick="editTask('${x.id}',${JSON.stringify(x.title)},${JSON.stringify(x.description||'')},${Number(x.reward||0)},${JSON.stringify(x.proof_instruction||'')})">✏️ Edit</button> <button class="gray" onclick="toggleTask('${x.id}',${!x.active})">${x.active?'⏸ Disable':'▶️ Enable'}</button></div>`).join('')}
async function renderUsers(c){const r=await db.from('profiles').select('id,telegram_id,username,first_name,balance,referral_code,created_at').order('created_at',{ascending:false}).limit(200);if(r.error)return c.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';c.innerHTML='<h2>👥 Users</h2>'+(r.data||[]).map(x=>`<div class="item"><div class="row"><b>${esc(x.first_name||'User')}</b><span>${money(x.balance)}</span></div><p>Telegram ID: ${esc(x.telegram_id)}<br>Username: ${esc(x.username||'—')}<br>Referral code: ${esc(x.referral_code||'—')}</p><p class="small muted">Joined: ${new Date(x.created_at).toLocaleString('bn-BD')}</p></div>`).join('')||'<p>No users.</p>'}
async function renderRefs(c){const r=await db.from('referrals').select('*,referrer:profiles!referrals_referrer_id_fkey(telegram_id,username,first_name),referred:profiles!referrals_referred_id_fkey(telegram_id,username,first_name)').order('created_at',{ascending:false}).limit(200);if(r.error)return c.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';c.innerHTML='<h2>🔗 Referrals</h2>'+(r.data||[]).map(x=>`<div class="item"><b>${esc(x.referrer?.first_name||'Referrer')}</b> → <b>${esc(x.referred?.first_name||'User')}</b><p>Reward: ${money(x.reward_amount)} • Status: ${esc(x.status||'—')}</p><p class="small muted">${new Date(x.created_at).toLocaleString('bn-BD')}</p></div>`).join('')||'<p>No referrals.</p>'}
async function renderSettings(c){const r=await db.from('settings').select('*').order('key');if(r.error)return c.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';c.innerHTML='<h2>⚙️ Settings</h2><p class="muted">এখান থেকে reward, minimum withdrawal এবং daily limit পরিবর্তন করা যাবে।</p>'+(r.data||[]).map(x=>`<div class="item form"><b>${esc(x.key)}</b><input id="s_${esc(x.key)}" type="number" step="0.01" value="${esc(x.value??'')}"><button class="primary" onclick="saveSetting('${esc(x.key)}')">💾 Save</button></div>`).join('')}
async function reviewTask(id,action){const note=prompt('Admin note (optional):')||'';const fn=action==='approve'?'approve_task_submission':'reject_task_submission';const r=await db.rpc(fn,{p_submission_id:id,p_admin_note:note});if(r.error)return msg(r.error.message,'error');msg('Submission updated','success');await load()}
async function reviewWithdraw(id,action){const note=prompt('Note (optional):')||'';const fn=action==='approve'?'approve_withdrawal':action==='reject'?'reject_withdrawal':'mark_withdrawal_paid';const r=await db.rpc(fn,{p_withdrawal_id:id,p_admin_note:note});if(r.error)return msg(r.error.message,'error');msg('Withdrawal updated','success');await load()}
async function addTask(){const title=document.getElementById('tt').value.trim(),description=document.getElementById('td').value.trim(),reward=Number(document.getElementById('tr').value),proof_instruction=document.getElementById('tp').value.trim();if(!title||reward<=0)return msg('Title এবং valid reward দিন','error');const r=await db.from('tasks').insert({title,description,reward,proof_instruction,active:true,category:'general',proof_type:'text',sort_order:100});if(r.error)return msg(r.error.message,'error');msg('Task added','success');await load()}
async function editTask(id,title,description,reward,proof){const nt=prompt('Task title:',title);if(nt===null)return;const nr=Number(prompt('Reward:',reward));if(!nr||nr<=0)return msg('Valid reward দিন','error');const nd=prompt('Description:',description);const np=prompt('Proof instruction:',proof);const r=await db.from('tasks').update({title:nt,description:nd??description,reward:nr,proof_instruction:np??proof}).eq('id',id);if(r.error)return msg(r.error.message,'error');msg('Task updated','success');await load()}
async function toggleTask(id,active){const r=await db.from('tasks').update({active}).eq('id',id);if(r.error)return msg(r.error.message,'error');msg(active?'Task enabled':'Task disabled','success');await load()}
async function saveSetting(key){const raw=document.getElementById('s_'+key).value;const v=Number(raw);if(Number.isNaN(v))return msg('Valid number দিন','error');const r=await db.from('settings').update({value:v}).eq('key',key);if(r.error)return msg(r.error.message,'error');msg('Setting saved','success');await load()}
(async()=>{const {data}=await db.auth.getSession();if(data.session){const a=await db.from('admin_users').select('role').eq('user_id',data.session.user.id).maybeSingle();if(a.data){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');document.getElementById('who').textContent=(data.session.user.email||'Admin')+' • '+a.data.role;load()}}})();
</script></body></html>
