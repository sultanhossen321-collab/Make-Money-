<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f5f7;
  font-family:Arial,sans-serif;
  color:#17212b;
}

.header{
  background:#172938;
  color:white;
  padding:18px;
  font-size:23px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 12px #0001;
}

.title{
  font-size:21px;
  font-weight:bold;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccd3d9;
  border-radius:10px;
  margin:7px 0;
  font-size:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  color:white;
  font-weight:bold;
  margin:6px 4px 0 0;
  cursor:pointer;
}

.login{
  background:#172938;
  width:100%;
}

.approve{
  background:#198754;
}

.reject{
  background:#dc3545;
}

.refresh{
  background:#168de2;
}

.balance{
  background:#6f42c1;
}

.logout{
  background:#6c757d;
}

.submission{
  border:1px solid #e0e5e9;
  border-radius:14px;
  padding:16px;
  margin-top:12px;
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:8px;
  font-weight:bold;
  margin-top:5px;
}

.pending{
  background:#fff3cd;
  color:#856404;
}

.approved{
  background:#d1e7dd;
  color:#0f5132;
}

.rejected{
  background:#f8d7da;
  color:#842029;
}

.error{
  color:#842029;
  background:#f8d7da;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.success{
  color:#0f5132;
  background:#d1e7dd;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.hidden{
  display:none;
}

.balance-box{
  background:#f7f2ff;
  border:1px solid #dfd0ff;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="header">
👨‍💼 Admin Panel
</div>

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="loginCard" class="card">

  <div class="title">
    🔐 Admin Login
  </div>

  <input
    id="email"
    type="email"
    placeholder="Admin Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button
    class="login"
    onclick="login()"
  >
    🔐 Login
  </button>

  <div id="loginMsg"></div>

</div>


<!-- ================= ADMIN AREA ================= -->

<div id="adminArea" class="hidden">

  <!-- Dashboard -->

  <div class="card">

    <div class="title">
      📊 Dashboard
    </div>

    <p>
      Pending Submissions:
      <b id="count">0</b>
    </p>

    <button
      class="refresh"
      onclick="loadSubmissions()"
    >
      🔄 Refresh
    </button>

    <button
      class="logout"
      onclick="logout()"
    >
      🚪 Logout
    </button>

  </div>


  <!-- Balance -->

  <div class="card">

    <div class="title">
      💰 Manual Balance Add
    </div>

    <input
      id="telegramId"
      type="text"
      placeholder="Telegram ID"
    >

    <input
      id="amount"
      type="number"
      step="0.01"
      placeholder="Amount"
    >

    <button
      class="balance"
      onclick="addBalance()"
    >
      💰 Add Balance
    </button>

    <div id="balanceMsg"></div>

  </div>


  <!-- Submissions -->

  <div class="card">

    <div class="title">
      📋 Submissions
    </div>

    <div id="list">
      লোড হচ্ছে...
    </div>

  </div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://cjfasocelwfvhhhghlma.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qYBMOJNal_V5ykKY6mcMzg_Oa-ASX7z";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   SETTINGS
===================================================== */

const USERS_TABLE = "users";

const REWARD_AMOUNT = 10;


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document.getElementById("email")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  const msg =
    document.getElementById("loginMsg");


  if(!email || !password){

    msg.innerHTML =
      '<div class="error">'+
      'Email এবং Password দিন।'+
      '</div>';

    return;
  }


  msg.innerHTML =
    "🔄 Login হচ্ছে...";


  const {error} =
    await db.auth.signInWithPassword({
      email:email,
      password:password
    });


  if(error){

    msg.innerHTML =
      '<div class="error">'+
      'Login ব্যর্থ:<br>'+
      esc(error.message)+
      '</div>';

    return;
  }


  msg.innerHTML = "";

  showAdmin();
}


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin(){

  const {data} =
    await db.auth.getSession();


  if(data.session){

    showAdmin();

  }

}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin(){

  document
    .getElementById("loginCard")
    .classList.add("hidden");


  document
    .getElementById("adminArea")
    .classList.remove("hidden");


  loadSubmissions();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await db.auth.signOut();


  document
    .getElementById("adminArea")
    .classList.add("hidden");


  document
    .getElementById("loginCard")
    .classList.remove("hidden");

}


/* =====================================================
   LOAD SUBMISSIONS
===================================================== */

async function loadSubmissions(){

  const list =
    document.getElementById("list");


  list.innerHTML =
    "🔄 লোড হচ্ছে...";


  const {data,error} =
    await db
      .from("submissions")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    list.innerHTML =
      '<div class="error">'+
      'Submission লোড হয়নি।<br><br>'+
      esc(error.message)+
      '</div>';

    return;
  }


  const pending =
    data.filter(
      x => x.status === "pending"
    );


  document
    .getElementById("count")
    .innerText =
      pending.length;


  if(!data.length){

    list.innerHTML =
      "কোনো submission নেই।";

    return;
  }


  list.innerHTML = "";


  data.forEach(x => {

    const box =
      document.createElement("div");

    box.className =
      "submission";


    let statusClass =
      "pending";


    if(x.status === "approved"){
      statusClass = "approved";
    }

    if(x.status === "rejected"){
      statusClass = "rejected";
    }


    box.innerHTML =

      "<b>📝 Submission #"+
      esc(x.id)+
      "</b>"+

      "<p>👤 Telegram ID: "+
      esc(x.telegram_id)+
      "</p>"+

      "<p>📋 Task ID: "+
      esc(x.task_id)+
      "</p>"+

      "<p>📝 Submission:<br>"+
      esc(x.submission)+
      "</p>"+

      "<span class='status "+
      statusClass+
      "'>"+
      esc(x.status)+
      "</span>";


    /* =============================
       PENDING BUTTONS
    ============================= */

    if(x.status === "pending"){

      const approve =
        document.createElement("button");


      approve.className =
        "approve";


      approve.innerText =
        "✅ Approve + ৳10";


      approve.onclick =
        () =>
          approveSubmission(x.id);


      const reject =
        document.createElement("button");


      reject.className =
        "reject";


      reject.innerText =
        "❌ Reject";


      reject.onclick =
        () =>
          rejectSubmission(x.id);


      box.appendChild(
        document.createElement("br")
      );


      box.appendChild(approve);

      box.appendChild(reject);

    }


    list.appendChild(box);

  });

}


/* =====================================================
   APPROVE
   DATABASE FUNCTION ব্যবহার করা হচ্ছে
===================================================== */

async function approveSubmission(id){

  const ok =
    confirm(
      "এই submission Approve করলে User-এর Balance-এ ৳10 যোগ হবে।\n\nApprove করবেন?"
    );


  if(!ok){
    return;
  }


  const {data,error} =
    await db.rpc(
      "approve_submission",
      {
        p_submission_id:id
      }
    );


  if(error){

    alert(
      "❌ Approve হয়নি:\n\n"+
      error.message
    );

    return;
  }


  if(data && data.already_processed){

    alert(
      "⚠️ Reward আগে দেওয়া হয়েছে।\n\n"+
      data.message
    );

    await loadSubmissions();

    return;
  }


  if(data && data.success){

    alert(
      "✅ Submission Approved!\n\n"+
      "Reward: ৳"+
      data.reward+
      "\n"+
      "নতুন Balance: ৳"+
      data.new_balance
    );

    await loadSubmissions();

    return;
  }


  alert(
    "⚠️ কোনো পরিবর্তন হয়নি।"
  );

}


/* =====================================================
   REJECT
===================================================== */

async function rejectSubmission(id){

  const ok =
    confirm(
      "এই submission Reject করবেন?\n\n"+
      "Reject করলে কোনো Balance যোগ হবে না।"
    );


  if(!ok){
    return;
  }


  const {error} =
    await db
      .from("submissions")
      .update({
        status:"rejected"
      })
      .eq("id",id)
      .eq("status","pending");


  if(error){

    alert(
      "❌ Reject হয়নি:\n\n"+
      error.message
    );

    return;
  }


  alert(
    "❌ Submission Rejected.\n"+
    "কোনো Balance যোগ হয়নি।"
  );


  await loadSubmissions();

}


/* =====================================================
   MANUAL BALANCE
===================================================== */

async function addBalance(){

  const telegramId =
    document
      .getElementById("telegramId")
      .value
      .trim();


  const amount =
    parseFloat(
      document
        .getElementById("amount")
        .value
    );


  const msg =
    document
      .getElementById("balanceMsg");


  if(!telegramId){

    msg.innerHTML =
      '<div class="error">'+
      'Telegram ID দিন।'+
      '</div>';

    return;
  }


  if(!amount || amount <= 0){

    msg.innerHTML =
      '<div class="error">'+
      'সঠিক Amount দিন।'+
      '</div>';

    return;
  }


  msg.innerHTML =
    "🔄 User খোঁজা হচ্ছে...";


  const {
    data:user,
    error:findError
  } =
    await db
      .from(USERS_TABLE)
      .select("*")
      .eq(
        "telegram_id",
        telegramId
      )
      .maybeSingle();


  if(findError){

    msg.innerHTML =
      '<div class="error">'+
      esc(findError.message)+
      '</div>';

    return;
  }


  if(!user){

    msg.innerHTML =
      '<div class="error">'+
      'এই Telegram ID-এর User পাওয়া যায়নি।'+
      '</div>';

    return;
  }


  const oldBalance =
    Number(
      user.balance || 0
    );


  const newBalance =
    oldBalance + amount;


  const {error:updateError} =
    await db
      .from(USERS_TABLE)
      .update({
        balance:newBalance
      })
      .eq(
        "telegram_id",
        telegramId
      );


  if(updateError){

    msg.innerHTML =
      '<div class="error">'+
      'Balance update হয়নি:<br>'+
      esc(updateError.message)+
      '</div>';

    return;
  }


  msg.innerHTML =
    '<div class="success">'+
    '✅ Balance সফলভাবে যোগ হয়েছে।'+
    '<br><br>'+
    '👤 Telegram ID: '+
    esc(telegramId)+
    '<br>'+
    '💰 আগের Balance: ৳'+
    oldBalance+
    '<br>'+
    '➕ যোগ হয়েছে: ৳'+
    amount+
    '<br>'+
    '💵 নতুন Balance: ৳'+
    newBalance+
    '</div>';


  document
    .getElementById("amount")
    .value = "";

}


/* =====================================================
   SECURITY: HTML ESCAPE
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}


/* =====================================================
   START
===================================================== */

checkLogin();

</script>

</body>
</html>
