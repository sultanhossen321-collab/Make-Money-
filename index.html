<style>
:root{--p:#5b18c9;--p2:#7926ec;--soft:#eee9ff;--green:#10cf84;--ink:#17213c;--muted:#69758b;--danger:#dc3545;--line:#e8e8f0}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:Arial,"Noto Sans Bengali","Hind Siliguri",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}body{min-height:100vh;background:linear-gradient(#fff 0,#fff 62%,#faf9ff 100%)}
.topbar{height:68px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #eeeef4;background:#fff;position:sticky;top:0;z-index:50}.menu-toggle{font-size:31px;line-height:1;color:#6420ce;width:43px;font-weight:900}.brand{font-size:27px;font-weight:900;color:#4715ae}.top-profile{margin-left:auto;border:1px solid #e5cfff;background:#fbf2ff;color:#7222d2;border-radius:28px;padding:10px 14px;font-weight:900;font-size:14px}
.profile{padding:19px 17px 14px;display:flex;align-items:center;gap:11px;max-width:720px;margin:auto}.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #7621dc;background:#eee;box-shadow:0 5px 16px #5b18c925}.welcome{font-size:17px;color:#56637b;font-weight:700}.name{font-size:22px;font-weight:900;margin-top:3px}.id-badge{margin-left:auto;background:#f4efff;border:1px solid #dfd1ff;color:#40377e;border-radius:28px;padding:10px 11px;font-size:13px;font-weight:900;white-space:nowrap}
.page{max-width:720px;margin:auto;padding:5px 16px 112px}.balance{position:relative;overflow:hidden;background:linear-gradient(135deg,#43109c,#5d13c1 44%,#8127ee);color:#fff;border-radius:28px;padding:20px 18px 21px;box-shadow:0 16px 34px #6720d145}.balance:after{content:"";position:absolute;width:520px;height:180px;right:-160px;bottom:-105px;background:#a65cff2b;border-radius:50%;transform:rotate(-12deg)}.balance>*{position:relative;z-index:1}.pillrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#ffffff22;padding:8px 9px;border-radius:24px;font-size:12px;font-weight:900}.total{font-size:16px;font-weight:800;margin-top:19px}.amount{font-size:51px;line-height:1;font-weight:900;margin:8px 0 26px}.balancefoot{border-top:1px solid #ffffff35;padding-top:17px;display:flex;align-items:center;justify-content:space-between;gap:12px}.username{font-size:14px}.withdraw{border:0;background:var(--green);color:#fff;font-weight:900;border-radius:20px;padding:12px 15px;box-shadow:0 7px 16px #00a87540}
.section-title{font-size:23px;font-weight:900;margin:27px 2px 18px;display:flex;align-items:center;gap:10px}.section-title .ico{color:#7024dd;font-size:30px}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 9px}.menu-btn{border:0;background:transparent;padding:0;color:#4214aa;font-weight:900}.hex{height:116px;background:#ddd9ff;clip-path:polygon(50% 0%,83% 18%,100% 50%,82% 82%,50% 100%,18% 82%,0 50%,18% 18%);display:flex;flex-direction:column;justify-content:center;align-items:center;transition:.15s}.menu-btn:active .hex{transform:scale(.97)}.hex-icon{font-size:31px;line-height:1;color:#10152c;margin-bottom:6px}.hex-label{font-size:16px;line-height:1.05}
.ref-card{margin-top:24px;background:linear-gradient(145deg,#f7f8ff,#eef1f8);border:1px solid #dfe4ef;border-radius:25px;padding:18px 14px 21px;box-shadow:0 5px 20px #00000008}.ref-title{font-size:20px;color:#6b20d6;font-weight:900;margin-bottom:12px}.ref-line{font-size:15px;color:#4e5a70;margin:8px 0;display:flex;gap:9px;align-items:center}.check{width:22px;height:22px;border-radius:50%;background:#10c981;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none}.linkbox{margin-top:17px;background:#fff;border:2px solid #e6d8ff;border-radius:22px;display:flex;align-items:center;overflow:hidden}.linkbox input{border:0;outline:0;min-width:0;flex:1;padding:14px 10px;font-size:13px;color:#15213d}.copy{border:0;background:linear-gradient(90deg,#8d21ef,#6d2ce7);color:#fff;font-weight:900;padding:12px 13px;border-radius:17px;margin-right:6px;white-space:nowrap}
.card{background:#fff;border:1px solid #ececf3;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0000000a}.notice{background:#f1f4f8;color:#647186;border-radius:15px;padding:13px;line-height:1.55}.reward{color:#7c25d8;font-weight:900;margin:7px 0}.desc{color:#667287;line-height:1.55}.primary{width:100%;border:0;background:linear-gradient(90deg,#9823ed,#6034ec);color:#fff;font-weight:900;border-radius:15px;padding:14px 16px}.secondary{width:100%;border:1px solid #ded7ef;background:#fff;color:#6420ce;font-weight:900;border-radius:15px;padding:13px 16px;margin-top:8px}.danger{background:#fff0f0;border:1px solid #ffd0d0;color:#a72b2b}.form label{display:block;font-weight:800;margin:12px 0 6px}.form input,.form textarea,.form select{width:100%;padding:13px;border:1px solid #dce2e8;border-radius:13px;background:#fafbfc}.form textarea{min-height:110px}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;background:#fff;border:1px solid #eee;border-radius:16px;padding:12px}.stat b{display:block;font-size:23px}.adbox{background:#15102a;color:#fff;border-radius:26px;padding:28px;text-align:center}.adreward{font-size:30px;font-weight:900;color:#00d89a}.tag{display:inline-block;padding:5px 10px;border-radius:20px;background:#f1f3f6;font-size:12px;font-weight:800}.empty{text-align:center;color:#909aa5;padding:45px 15px}.status-pending{background:#fff4cf;color:#806400}.status-approved{background:#d9f8e9;color:#087345}.status-rejected{background:#ffe0e0;color:#a11f1f}.toast{position:fixed;left:50%;top:82px;transform:translate(-50%,-15px);z-index:100;background:#17112d;color:#fff;padding:11px 15px;border-radius:14px;box-shadow:0 10px 30px #0003;opacity:0;pointer-events:none;transition:.2s;font-size:13px;font-weight:700;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.bottom{position:fixed;z-index:60;left:0;right:0;bottom:0;height:70px;background:#fff;border-top:1px solid #e5e6ee;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -5px 18px #00000008}.bottom button{border:0;background:#fff;color:#34405f;font-size:11px;font-weight:800}.bottom button.active{color:#7024dd;background:#f2eaff;border-radius:28px;margin:7px 10px}.bottom span{display:block;font-size:23px;line-height:28px}@media(min-width:521px){.bottom{max-width:720px;left:50%;right:auto;transform:translateX(-50%);width:100%;border-radius:20px 20px 0 0}}
.modal{position:fixed;inset:0;background:#0007;z-index:200;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(720px,100%);background:#fff;border-radius:28px 28px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f1f2f6;border-radius:50%;width:38px;height:38px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:12px;color:#7b8495}.money{font-weight:900;color:#6d22d5}
</style>

<body>
<header class="topbar"><div class="menu-toggle">☰</div><div class="brand">Money Maker</div><button class="top-profile" onclick="show('profile')">👤 My Profile</button></header>
<section class="profile"><img id="avatar" class="avatar" alt=""><div><div class="welcome">Welcome 👋</div><div id="userName" class="name">User</div></div><div id="idBadge" class="id-badge">🟢 ID : <b>—</b></div></section>
<main id="app" class="page">
<section class="balance"><div class="pillrow"><span class="pill">💳 মোট ইনকাম ব্যালেন্স</span><span class="pill">🪪 ID : <span id="staticId">—</span></span></div><div class="total">🪙 মোট ইনকাম ব্যালেন্স</div><div class="amount" id="staticBalance">৳0.00</div><div class="balancefoot"><span class="username">👤 ইউজার নাম: <b id="staticUsername">User</b></span><button class="withdraw" onclick="show('withdraw')">💸 উইথড্র করুন</button></div></section>
<h2 class="section-title"><span class="ico">▰</span> প্রয়োজনীয় মেনু</h2><div class="menu">
<button class="menu-btn" onclick="show('gmail')"><div class="hex"><div class="hex-icon">✉</div><div class="hex-label">জিমেইল</div></div></button>
<button class="menu-btn" onclick="show('ads')"><div class="hex"><div class="hex-icon">▣</div><div class="hex-label">এড দেখুন</div></div></button>
<button class="menu-btn" onclick="show('tasks')"><div class="hex"><div class="hex-icon">☷</div><div class="hex-label">নতুন টাস্ক</div></div></button>
<button class="menu-btn" onclick="show('history')"><div class="hex"><div class="hex-icon">◔</div><div class="hex-label">হিস্টরি</div></div></button>
<button class="menu-btn" onclick="show('ref')"><div class="hex"><div class="hex-icon">♟</div><div class="hex-label">রেফার</div></div></button>
<button class="menu-btn" onclick="support()"><div class="hex"><div class="hex-icon">♧</div><div class="hex-label">সাপোর্ট</div></div></button></div>
<section class="ref-card"><div class="ref-title">🎁 রেফার প্রোগ্রাম অফার</div><div class="ref-line"><span class="check">✓</span>প্রতি রেফারে পাবেন: <b id="staticReferralReward">৳4.00</b></div><div class="ref-line"><span class="check">✓</span>উইথড্র থেকে আজীবন কমিশন সুবিধা ✅</div><div class="linkbox"><input id="homeRefLink" value="https://t.me/moneymaker_bot" readonly><button class="copy" onclick="copyRef()">▣ কপি</button></div></section>
</main>
<nav class="bottom"><button id="nav-home" class="active" onclick="show('home')"><span>🏠</span>হোম</button><button id="nav-tasks" onclick="show('tasks')"><span>☷</span>টাস্ক</button><button id="nav-withdraw" onclick="show('withdraw')"><span>▣</span>ইনকাম</button><button id="nav-ref" onclick="show('ref')"><span>👥</span>রেফার</button><button onclick="support()"><span>🎧</span>সাপোর্ট</button></nav>
<div id="modal" class="modal"><div class="sheet"><div class="sheet-head"><h2 id="modalTitle">Money Maker</h2><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://cjfasocelwfvhhhghlma.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_qYBMOJNal_V5ykKY6mcMzg_Oa-ASX7z";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const ADSGRAM_BLOCK_ID="47943";
let AdsController=null;
function initAdsGram(){try{if(window.Adsgram&&!AdsController)AdsController=window.Adsgram.init({blockId:ADSGRAM_BLOCK_ID});}catch(e){console.error("AdsGram init failed",e)}return AdsController;}
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const tgInit=tg?.initData||"";const qs=new URLSearchParams(location.search);
let state={profile:null,tasks:[],subs:[],withdrawals:[],referrals:[],settings:{},ref:qs.get("ref")||qs.get("startapp")?.replace(/^ref_/i,"")||"",ready:false};
const money=v=>"৳"+Number(v||0).toFixed(2);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),3200)}
function nav(x){document.querySelectorAll(".bottom button").forEach(b=>b.classList.remove("active"));const e=document.getElementById("nav-"+x);if(e)e.classList.add("active")}
function setUser(){if(!state.profile)return;const p=state.profile;document.getElementById("userName").textContent=p.first_name||"User";document.getElementById("idBadge").innerHTML='🟢 ID : <b>'+esc(p.telegram_id||"—")+'</b>';document.getElementById("staticId").textContent=p.telegram_id||"—";document.getElementById("staticUsername").textContent=p.first_name||"User";document.getElementById("staticBalance").textContent=money(p.balance);if(p.avatar_url)document.getElementById("avatar").src=p.avatar_url;}
async function boot(){
 if(!tgInit){toast("Telegram-এর ভিতর থেকে অ্যাপটি খুলুন।");return}
 try{
  const r=await fetch(SUPABASE_URL+"/functions/v1/telegram-auth",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({initData:tgInit,ref:state.ref})});
  const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||"Telegram verification failed");
  if(!j.access_token||!j.refresh_token)throw new Error("Supabase session পাওয়া যায়নি");
  const sr=await db.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
  if(sr.error)throw sr.error;
  state.profile=j.profile;state.ready=true;setUser();await refreshAll();renderHome();
 }catch(e){console.error(e);toast(e.message||"অ্যাপ লোড হয়নি");}
}
async function refreshAll(){await Promise.all([loadTasks(),loadSubs(),loadWithdrawals(),loadReferrals(),loadSettings()]);const rr=state.settings.referral_reward??4;document.getElementById("staticReferralReward").textContent=money(rr);const code=state.profile?.referral_code||"";document.getElementById("homeRefLink").value="https://t.me/bdeasymoneymaker_bot?startapp=ref_"+code;setUser()}
async function loadTasks(){const r=await db.from("tasks").select("*").eq("active",true).order("sort_order",{ascending:true});if(!r.error)state.tasks=r.data||[];}
async function loadSubs(){if(!state.profile)return;const r=await db.from("task_submissions").select("*,tasks(title,reward)").eq("user_id",state.profile.id).order("created_at",{ascending:false});if(!r.error)state.subs=r.data||[];}
async function loadWithdrawals(){if(!state.profile)return;const r=await db.from("withdrawals").select("*").eq("user_id",state.profile.id).order("created_at",{ascending:false});if(!r.error)state.withdrawals=r.data||[];}
async function loadReferrals(){if(!state.profile)return;const r=await db.from("referrals").select("*").eq("referrer_id",state.profile.id).order("created_at",{ascending:false});if(!r.error)state.referrals=r.data||[];}
async function loadSettings(){const r=await db.from("settings").select("*");if(!r.error)(r.data||[]).forEach(x=>state.settings[x.key]=x.value??x.text_value)}
function show(p){nav(p==="home"?"home":p==="tasks"?"tasks":p==="ref"?"ref":p==="history"?"history":"withdraw");if(p==="home")renderHome();else if(p==="tasks")renderTasks();else if(p==="history")renderHistory();else if(p==="profile")renderProfile();else if(p==="gmail")renderGmail();else if(p==="ads")renderAds();else if(p==="ref")renderReferral();else if(p==="withdraw")renderWithdraw()}
function renderHome(){document.getElementById("app").innerHTML=`<section class="balance"><div class="pillrow"><span class="pill">💳 মোট ইনকাম ব্যালেন্স</span><span class="pill">ID : ${esc(state.profile?.telegram_id||"—")}</span></div><div class="total">🪙 মোট ইনকাম ব্যালেন্স</div><div class="amount">${money(state.profile?.balance)}</div><div class="balancefoot"><span class="username">👤 ইউজার নাম: <b>${esc(state.profile?.first_name||"User")}</b></span><button class="withdraw" onclick="show('withdraw')">💸 উইথড্র করুন</button></div></section><h2 class="section-title"><span class="ico">▰</span> প্রয়োজনীয় মেনু</h2><div class="menu"><button class="menu-btn" onclick="show('gmail')"><div class="hex"><div class="hex-icon">✉</div><div class="hex-label">জিমেইল</div></div></button><button class="menu-btn" onclick="show('ads')"><div class="hex"><div class="hex-icon">▣</div><div class="hex-label">এড দেখুন</div></div></button><button class="menu-btn" onclick="show('tasks')"><div class="hex"><div class="hex-icon">☷</div><div class="hex-label">নতুন টাস্ক</div></div></button><button class="menu-btn" onclick="show('history')"><div class="hex"><div class="hex-icon">◔</div><div class="hex-label">হিস্টরি</div></div></button><button class="menu-btn" onclick="show('ref')"><div class="hex"><div class="hex-icon">♟</div><div class="hex-label">রেফার</div></div></button><button class="menu-btn" onclick="support()"><div class="hex"><div class="hex-icon">♧</div><div class="hex-label">সাপোর্ট</div></div></button></div><section class="ref-card"><div class="ref-title">🎁 রেফার প্রোগ্রাম অফার</div><div class="ref-line"><span class="check">✓</span>প্রতি রেফারে পাবেন: <b>${money(state.settings.referral_reward??4)}</b></div><div class="ref-line"><span class="check">✓</span>উইথড্র থেকে আজীবন কমিশন সুবিধা ✅</div><div class="linkbox"><input id="homeRefLink" value="https://t.me/bdeasymoneymaker_bot?startapp=ref_${esc(state.profile?.referral_code||"")}" readonly><button class="copy" onclick="copyRef()">▣ কপি</button></div></section>`}
function copyRef(){const el=document.getElementById("homeRefLink")||document.getElementById("refLink");if(!el)return;navigator.clipboard?.writeText(el.value).then(()=>toast("Referral link copied"),()=>{el.select();document.execCommand("copy");toast("Referral link copied")})}
function renderTasks(){const html=state.tasks.length?state.tasks.map(t=>`<div class="card"><div class="row"><b>${esc(t.title)}</b><span class="tag">${esc(t.category||"Task")}</span></div><div class="reward">💰 ${money(t.reward)}</div><div class="desc">${esc(t.description||"")}</div>${t.proof_instruction?`<div class="notice" style="margin-top:10px">📌 ${esc(t.proof_instruction)}</div>`:""}<button class="primary" style="margin-top:13px" onclick="openTask('${t.id}')">কাজ শুরু করুন</button></div>`).join(""):'<div class="card empty">বর্তমানে কোনো active task নেই।</div>';document.getElementById("app").innerHTML=`<h2 class="section-title">📋 নতুন টাস্ক</h2><div class="notice">Admin যোগ করা active task এখানে দেখাবে। কাজের প্রমাণ ছাড়া reward দেওয়া হবে না।</div>${html}`}
function openTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const proofType=t.proof_type||"text";let input=proofType.toLowerCase().includes("url")?`<input id="proof" type="url" placeholder="https://...">`:proofType.toLowerCase().includes("email")?`<input id="proof" type="email" placeholder="আপনার email address">`:`<textarea id="proof" placeholder="আপনার proof / report লিখুন"></textarea>`;document.getElementById("app").innerHTML=`<h2 class="section-title">📝 ${esc(t.title)}</h2><div class="card"><div class="reward">💰 Reward: ${money(t.reward)}</div><p class="desc">${esc(t.description||"")}</p><div class="notice">${esc(t.proof_instruction||"কাজ সম্পন্ন করে non-sensitive proof দিন।")}</div><div class="form"><label>প্রমাণ</label>${input}<button class="primary" style="margin-top:12px" onclick="submitTask('${t.id}')">📤 Submit</button><button class="secondary" onclick="show('tasks')">ফিরে যান</button></div></div>`}
async function submitTask(id){if(!state.profile)return toast("Profile ready হয়নি");const el=document.getElementById("proof"),proof=el?.value.trim();if(!proof)return toast("প্রমাণ দিন");const t=state.tasks.find(x=>x.id===id);const r=await db.from("task_submissions").insert({task_id:id,user_id:state.profile.id,proof_text:proof,status:"pending",reward_snapshot:t.reward});if(r.error)return toast(r.error.message);toast("Submission পাঠানো হয়েছে");await loadSubs();show("history")}
function statusTag(s){return `<span class="tag status-${esc(s)}">${s==="pending"?"⏳ Pending":s==="approved"?"✅ Approved":"❌ Rejected"}</span>`}
function renderHistory(){const total=state.subs.length,ap=state.subs.filter(x=>x.status==="approved").length,pe=state.subs.filter(x=>x.status==="pending").length;document.getElementById("app").innerHTML=`<h2 class="section-title">🕘 কাজের হিস্টরি</h2><div class="statrow"><div class="stat">মোট<b>${total}</b></div><div class="stat">Approved<b>${ap}</b></div><div class="stat">Pending<b>${pe}</b></div></div>${state.subs.map(s=>`<div class="card"><div class="row"><b>${esc(s.tasks?.title||"Task")}</b>${statusTag(s.status)}</div><p class="small">${new Date(s.created_at).toLocaleString("bn-BD")}</p><div class="money">${money(s.reward_snapshot)}</div>${s.admin_note?`<div class="notice">Admin: ${esc(s.admin_note)}</div>`:""}</div>`).join("")||'<div class="empty">কোনো history নেই।</div>'}`}
function renderGmail(){const reward=15;document.getElementById("app").innerHTML=`<h2 class="section-title">✉️ Gmail Verification</h2><div class="card"><div class="row"><h2 style="margin:0">Gmail Verification Task</h2><span class="tag">৳15 Reward</span></div><p class="desc">Gmail verification task সম্পন্ন করে verification proof দিন।</p><div class="notice">verification proof দিন</div><div class="form"><label>Verification proof <span class="small">(ঐচ্ছিক)</span></label><textarea id="gmailProof" placeholder="Verification proof লিখতে পারেন"></textarea><label>Screenshot <span class="small">(ঐচ্ছিক)</span></label><input id="gmailPic" type="file" accept="image/png,image/jpeg"><div class="notice" style="margin-top:10px">পিক না দিলেও Submit করা যাবে।</div><button class="primary" style="margin-top:12px" onclick="submitGmailTask()">📤 Submit</button></div></div>`}
function findGmailTask(){const t=state.tasks.find(x=>/gmail|email/i.test(x.title||""));if(t)openTask(t.id);else toast("বর্তমানে Gmail task নেই")}
async function submitGmailTask(){if(!state.profile)return toast("Profile ready হয়নি");const t=state.tasks.find(x=>/gmail|email/i.test(x.title||""));if(!t)return toast("বর্তমানে Gmail task নেই");const proof=document.getElementById("gmailProof")?.value.trim()||"";const pic=document.getElementById("gmailPic")?.files?.[0];if(pic&&pic.size>5*1024*1024)return toast("ছবির সাইজ সর্বোচ্চ 5MB");const proofText=proof+(pic?`\n[সcreenshot: ${pic.name}]`:"")||"verification proof not provided";const r=await db.from("task_submissions").insert({task_id:t.id,user_id:state.profile.id,proof_text:proofText,status:"pending",reward_snapshot:15});if(r.error)return toast(r.error.message);toast("Submission পাঠানো হয়েছে");await loadSubs();show("history")}
function renderAds(){const r=state.settings.ad_reward??0.10,l=state.settings.daily_ad_limit??100;document.getElementById("app").innerHTML=`<h2 class="section-title">📺 এড দেখুন</h2><div class="card"><div class="statrow"><div class="stat"><span>💰</span><b>${money(r)}</b><small>প্রতি এড</small></div><div class="stat"><span>📅</span><b>${l}</b><small>দৈনিক লিমিট</small></div><div class="stat"><span>🎁</span><b>৳${(r*l).toFixed(2)}</b><small>সর্বোচ্চ আয়</small></div></div></div><div class="adbox"><div style="font-size:58px">📺</div><h2 style="margin:8px 0">বিজ্ঞাপন দেখে আয় করুন</h2><div class="adreward">${money(r)}</div><p style="margin:6px 0 20px">প্রতি verified ad সম্পূর্ণ দেখলে reward</p><button class="primary" onclick="startAd()">▶️ এড দেখুন</button></div><div class="card"><h3 style="margin-top:0">কীভাবে কাজ করবে?</h3><p class="desc">১. <b>এড দেখুন</b> বাটনে চাপুন।</p><p class="desc">২. বিজ্ঞাপন সম্পূর্ণ দেখুন।</p><p class="desc">৩. Provider থেকে reward verification হলে আপনার balance-এ টাকা যোগ হবে।</p><div class="notice">✅ AdsGram Rewarded Ad যুক্ত হয়েছে। বিজ্ঞাপন সম্পূর্ণ দেখলে provider callback পাওয়া যায়; server-side verification ছাড়া কোনো ভুয়া reward credit করা হবে না।</div></div><div class="card"><h3 style="margin-top:0">📌 নিয়ম</h3><p class="desc">• প্রতিদিন সর্বোচ্চ ${l}টি verified ad।</p><p class="desc">• বিজ্ঞাপন skip/অসম্পূর্ণ হলে reward হবে না।</p><p class="desc">• Daily limit ও reward Admin Panel থেকে পরিবর্তন করা যাবে।</p></div>`}
function startAd(){
  if(!state.profile)return toast("Profile ready হয়নি");
  const ad=initAdsGram();
  if(!ad)return toast("AdsGram এখনো load হয়নি। একটু পরে আবার চেষ্টা করুন।");
  const btn=[...document.querySelectorAll("button")].find(x=>x.textContent.includes("এড দেখুন"));
  if(btn){btn.disabled=true;btn.textContent="⏳ বিজ্ঞাপন লোড হচ্ছে..."}
  ad.show().then(async(result)=>{
    if(result&&result.done===false)throw result;
    toast("✅ বিজ্ঞাপন সম্পূর্ণ হয়েছে। Reward verification চলছে।");
    await refreshAll();
    renderAds();
  }).catch((e)=>{
    console.warn("AdsGram show failed/skipped",e);
    toast(e?.description||"বিজ্ঞাপন সম্পূর্ণ হয়নি, তাই reward দেওয়া হয়নি।");
  }).finally(()=>{
    const b=[...document.querySelectorAll("button")].find(x=>x.textContent.includes("বিজ্ঞাপন লোড হচ্ছে"));
    if(b){b.disabled=false;b.textContent="▶️ এড দেখুন"}
  });
}
function renderReferral(){const link="https://t.me/bdeasymoneymaker_bot?startapp=ref_"+(state.profile?.referral_code||"");document.getElementById("app").innerHTML=`<h2 class="section-title">👥 Referral</h2><div class="ref-card"><div class="ref-title">🎁 রেফার প্রোগ্রাম অফার</div><div class="ref-line"><span class="check">✓</span>প্রতি qualifying referral: <b>${money(state.settings.referral_reward??4)}</b></div><div class="ref-line"><span class="check">✓</span>শর্ত পূরণ করলে commission যোগ হবে</div><div class="linkbox"><input id="refLink" value="${esc(link)}" readonly><button class="copy" onclick="copyRef()">▣ কপি</button></div></div><div class="card"><h3>আপনার Referral</h3>${state.referrals.length?state.referrals.map(r=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #eee"><span>👤 ${esc(r.referred_user_id||"")}</span><span>${statusTag(r.status||"pending")}</span></div>`).join(""):'<div class="empty">এখনও কোনো referral নেই।</div>'}</div>`}
function renderWithdraw(){const min=Number(state.settings.minimum_withdraw??250);document.getElementById("app").innerHTML=`<h2 class="section-title">💸 Withdraw</h2><div class="card"><div class="row"><span>Available Balance</span><b class="money">${money(state.profile?.balance)}</b></div><div class="notice" style="margin-top:12px">Minimum withdrawal: <b>${money(min)}</b><br>Methods: bKash, Nagad, Rocket</div><div class="form"><label>Amount</label><input id="wa" type="number" min="${min}" step="0.01" placeholder="${min}"><label>Payment Method</label><select id="wm"><option>bKash</option><option>Nagad</option><option>Rocket</option></select><label>Payment Number</label><input id="wn" inputmode="numeric" maxlength="20" placeholder="01XXXXXXXXX"><button class="primary" style="margin-top:12px" onclick="requestWithdraw()">Request Withdraw</button></div></div><div class="card"><h3>Withdrawal History</h3>${state.withdrawals.map(w=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #eee"><span>${esc(w.payment_method)}<br><span class="small">${esc(w.payment_number)}</span></span><span>${money(w.amount)}<br>${statusTag(w.status)}</span></div>`).join("")||'<div class="empty">কোনো withdrawal নেই।</div>'}</div>`}
async function requestWithdraw(){const amount=Number(document.getElementById("wa")?.value),min=Number(state.settings.minimum_withdraw??250),method=document.getElementById("wm")?.value,number=document.getElementById("wn")?.value.trim();if(!Number.isFinite(amount)||amount<min)return toast("Minimum withdrawal "+money(min));if(amount>Number(state.profile?.balance||0))return toast("Insufficient balance");if(!/^01\d{8,18}$/.test(number))return toast("সঠিক payment number দিন");const pending=state.withdrawals.filter(x=>x.status==="pending").reduce((s,x)=>s+Number(x.amount||0),0);if(amount+pending>Number(state.profile.balance||0))return toast("আপনার pending withdrawal সহ balance যথেষ্ট নয়");const r=await db.from("withdrawals").insert({user_id:state.profile.id,amount,payment_method:method,payment_number:number,status:"pending"});if(r.error)return toast(r.error.message);toast("Withdrawal request পাঠানো হয়েছে");await loadWithdrawals();renderWithdraw()}
function renderProfile(){document.getElementById("app").innerHTML=`<h2 class="section-title">👤 My Profile</h2><div class="card"><div class="row"><b>${esc(state.profile?.first_name||"User")}</b><span class="tag">Telegram</span></div><p>Telegram ID: <b>${esc(state.profile?.telegram_id||"")}</b></p><p>Username: ${esc(state.profile?.username?"@"+state.profile.username:"—")}</p><p>Referral Code: ${esc(state.profile?.referral_code||"—")}</p><p>Balance: <b class="money">${money(state.profile?.balance)}</b></p></div>`}
function support(){if(tg?.showPopup)tg.showPopup({title:"Support",message:"Support contact এখনো সেট করা হয়নি। Admin panel থেকে support contact যোগ করার পর এখানে ব্যবহার করা যাবে।",buttons:[{id:"ok",type:"ok",text:"OK"}]});else alert("Support contact এখনো সেট করা হয়নি।")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
boot();
</script>
