<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Money Maker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--p:#5b18c9;--p2:#7926ec;--soft:#eee9ff;--green:#10cf84;--ink:#17213c;--muted:#69758b}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:Arial,"Noto Sans Bengali","Hind Siliguri",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
body{min-height:100vh;background:linear-gradient(#fff 0,#fff 58%,#faf9ff 100%)}
.topbar{height:76px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #eeeef4;background:#fff;position:sticky;top:0;z-index:50}
.menu-toggle{font-size:35px;line-height:1;color:#6420ce;width:48px;text-align:left;font-weight:900}.brand{font-size:29px;font-weight:900;color:#4715ae;letter-spacing:-.4px}.top-profile{margin-left:auto;border:1px solid #e5cfff;background:#fbf2ff;color:#7222d2;border-radius:28px;padding:11px 18px;font-weight:900;font-size:16px}
.profile{padding:22px 24px 16px;display:flex;align-items:center;gap:15px;max-width:720px;margin:auto}.avatar{width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid #7621dc;background:#eee;box-shadow:0 5px 16px #5b18c925}.welcome{font-size:20px;color:#56637b;font-weight:700}.name{font-size:25px;font-weight:900;margin-top:3px}.id-badge{margin-left:auto;background:#f4efff;border:1px solid #dfd1ff;color:#40377e;border-radius:28px;padding:13px 17px;font-weight:900;white-space:nowrap}.id-badge b{color:#312b74}
.page{max-width:720px;margin:auto;padding:6px 24px 115px}
.balance{position:relative;overflow:hidden;background:linear-gradient(135deg,#43109c 0%,#5d13c1 44%,#8127ee 100%);color:#fff;border-radius:31px;padding:24px 24px 25px;box-shadow:0 16px 34px #6720d145}.balance:after{content:"";position:absolute;width:520px;height:180px;right:-160px;bottom:-105px;background:#a65cff2b;border-radius:50%;transform:rotate(-12deg)}
.balance>*{position:relative;z-index:1}.pillrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#ffffff22;padding:10px 13px;border-radius:24px;font-size:15px;font-weight:900}.total{font-size:18px;font-weight:800;margin-top:22px}.amount{font-size:61px;line-height:1;font-weight:900;margin:8px 0 30px;letter-spacing:-1px}.balancefoot{border-top:1px solid #ffffff35;padding-top:17px;display:flex;align-items:center;justify-content:space-between;gap:12px}.username{font-size:17px}.withdraw{border:0;background:var(--green);color:#fff;font-weight:900;border-radius:20px;padding:14px 20px;box-shadow:0 7px 16px #00a87540}
.section-title{font-size:27px;font-weight:900;margin:30px 2px 18px;display:flex;align-items:center;gap:10px;color:#17213c}.section-title .ico{color:#7024dd;font-size:30px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 20px}.menu-btn{border:0;background:transparent;padding:0;color:#4214aa;font-weight:900}.hex{height:139px;background:#ddd9ff;clip-path:polygon(50% 0%,83% 18%,100% 50%,82% 82%,50% 100%,18% 82%,0 50%,18% 18%);display:flex;flex-direction:column;justify-content:center;align-items:center;transition:.15s}.menu-btn:active .hex{transform:scale(.97)}.hex-icon{font-size:40px;line-height:1;color:#10152c;margin-bottom:8px}.hex-label{font-size:20px;line-height:1.05}
.ref-card{margin-top:24px;background:linear-gradient(145deg,#f7f8ff,#eef1f8);border:1px solid #dfe4ef;border-radius:28px;padding:21px 18px 25px;box-shadow:0 5px 20px #00000008}.ref-title{font-size:23px;color:#6b20d6;font-weight:900;margin-bottom:12px}.ref-line{font-size:17px;color:#4e5a70;margin:8px 0;display:flex;gap:9px;align-items:center}.check{width:22px;height:22px;border-radius:50%;background:#10c981;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none}.linkbox{margin-top:17px;background:#fff;border:2px solid #e6d8ff;border-radius:22px;display:flex;align-items:center;overflow:hidden;box-shadow:0 4px 14px #8a2bdd10}.linkbox input{border:0;outline:0;min-width:0;flex:1;padding:16px 14px;font-size:16px;color:#15213d;background:#fff}.copy{border:0;background:linear-gradient(90deg,#8d21ef,#6d2ce7);color:#fff;font-weight:900;padding:14px 18px;border-radius:17px;margin-right:6px;white-space:nowrap}
.card{background:#fff;border:1px solid #ececf3;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0000000a}.notice{background:#f1f4f8;color:#647186;border-radius:15px;padding:13px;line-height:1.55}.reward{color:#7c25d8;font-weight:900;margin:7px 0}.desc{color:#667287;line-height:1.55}.primary{width:100%;border:0;background:linear-gradient(90deg,#9823ed,#6034ec);color:#fff;font-weight:900;border-radius:15px;padding:14px 16px}.form label{display:block;font-weight:800;margin:12px 0 6px}.form input,.form textarea,.form select{width:100%;padding:13px;border:1px solid #dce2e8;border-radius:13px;background:#fafbfc}.form textarea{min-height:110px}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;background:#fff;border:1px solid #eee;border-radius:16px;padding:12px}.stat b{display:block;font-size:23px}.adbox{background:#15102a;color:#fff;border-radius:26px;padding:28px;text-align:center}.adreward{font-size:30px;font-weight:900;color:#00d89a}.tag{display:inline-block;padding:5px 10px;border-radius:20px;background:#f1f3f6;font-size:12px;font-weight:800}.empty{text-align:center;color:#909aa5;padding:45px 15px}
.bottom{position:fixed;z-index:60;left:0;right:0;bottom:0;height:75px;background:#fff;border-top:1px solid #e5e6ee;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -5px 18px #00000008}.bottom button{border:0;background:#fff;color:#34405f;font-size:13px;font-weight:800}.bottom button.active{color:#7024dd;background:#f2eaff;border-radius:28px;margin:7px 10px}.bottom span{display:block;font-size:26px;line-height:28px}
@media(max-width:520px){.topbar{height:68px;padding:0 14px}.menu-toggle{font-size:31px;width:43px}.brand{font-size:26px}.top-profile{padding:10px 13px;font-size:14px}.profile{padding:19px 17px 14px;gap:11px}.avatar{width:64px;height:64px}.welcome{font-size:17px}.name{font-size:22px}.id-badge{font-size:13px;padding:10px 11px}.page{padding:5px 16px 112px}.balance{border-radius:28px;padding:20px 18px 21px}.pill{font-size:12px;padding:8px 9px}.total{font-size:16px;margin-top:19px}.amount{font-size:51px;margin-bottom:26px}.username{font-size:14px}.withdraw{padding:12px 15px;font-size:14px}.section-title{font-size:23px;margin-top:27px}.menu{gap:12px 9px}.hex{height:116px}.hex-icon{font-size:31px;margin-bottom:6px}.hex-label{font-size:16px}.ref-card{border-radius:25px;padding:18px 14px 21px}.ref-title{font-size:20px}.ref-line{font-size:15px}.linkbox input{font-size:13px;padding:14px 10px}.copy{font-size:14px;padding:12px 13px}.bottom{height:70px}.bottom button{font-size:11px}.bottom span{font-size:23px}}
@media(min-width:521px){body{padding-bottom:0}.bottom{max-width:720px;left:50%;right:auto;transform:translateX(-50%);width:100%;border-radius:20px 20px 0 0}}
</style>
</head>
<body>
<header class="topbar"><div class="menu-toggle">☰</div><div class="brand">Money Maker</div><button class="top-profile" onclick="show('profile')">👤 My Profile</button></header>
<section class="profile"><img id="avatar" class="avatar" alt=""><div><div class="welcome">Welcome 👋</div><div id="userName" class="name">User</div></div><div id="idBadge" class="id-badge">🟢 ID : <b>—</b></div></section>
<main id="app" class="page"></main>
<nav class="bottom"><button id="nav-home" class="active" onclick="show('home')"><span>🏠</span>হোম</button><button id="nav-microjob" onclick="show('microjob')"><span>☷</span>টাস্ক</button><button id="nav-wallet" onclick="show('withdraw')"><span>▣</span>ইনকাম</button><button id="nav-ref" onclick="show('ref')"><span>👥</span>রেফার</button><button onclick="support()"><span>🎧</span>সাপোর্ট</button></nav>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const tgInit=tg?.initData||"";let state={profile:null,tasks:[],subs:[],settings:{},ref:new URLSearchParams(location.search).get("ref")};const money=v=>"৳"+Number(v||0).toFixed(2);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function boot(){if(!tgInit){document.getElementById("app").innerHTML='<div class="card"><h2>Telegram Mini App</h2><p>এই অ্যাপটি Telegram-এর ভিতর থেকে খুলুন।</p></div>';return}const gs=await db.auth.getSession();let session=gs.data.session;if(!session){const r=await db.auth.signInAnonymously();if(r.error){document.getElementById("app").innerHTML='<div class="card"><b>Supabase Anonymous Auth চালু করুন।</b><p class="desc">'+esc(r.error.message)+'</p></div>';return}session=(await db.auth.getSession()).data.session}const r=await fetch(SUPABASE_URL+"/functions/v1/telegram-auth",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({initData:tgInit,ref:state.ref})});const j=await r.json();if(!r.ok){document.getElementById("app").innerHTML='<div class="card"><b>Telegram verification failed</b><p class="desc">'+esc(j.error||"Unknown error")+'</p></div>';return}state.profile=j.profile;document.getElementById("userName").textContent=state.profile.first_name||"User";document.getElementById("idBadge").innerHTML='🟢 ID : <b>'+esc(state.profile.telegram_id)+'</b>';if(state.profile.avatar_url)document.getElementById("avatar").src=state.profile.avatar_url;await Promise.all([loadTasks(),loadSubs(),loadSettings()]);show("home")}
async function loadTasks(){const r=await db.from("tasks").select("*").eq("active",true).order("sort_order",{ascending:true});state.tasks=r.data||[]}async function loadSubs(){const r=await db.from("task_submissions").select("*,tasks(title,reward)").eq("user_id",state.profile.id).order("created_at",{ascending:false});state.subs=r.data||[]}async function loadSettings(){const r=await db.from("settings").select("*");(r.data||[]).forEach(x=>state.settings[x.key]=x.value??x.text_value)}
function nav(x){document.querySelectorAll(".bottom button").forEach(b=>b.classList.remove("active"));const e=document.getElementById("nav-"+x);if(e)e.classList.add("active")}
function show(p){nav(p==="home"?"home":p==="microjob"?"microjob":p==="ref"?"ref":"wallet");const a=document.getElementById("app");if(p==="home")a.innerHTML=home();if(p==="microjob")a.innerHTML=microjob();if(p==="history")historyPage();if(p==="profile")profile();if(p==="gmail")gmail();if(p==="ads")ads();if(p==="ref")referral();if(p==="withdraw")withdrawPage()}
function home(){const code=state.profile.referral_code||"";const link="https://t.me/moneymaker_bot?startapp=ref_"+code;return `<section class="balance"><div class="pillrow"><span class="pill">💳 মোট ইনকাম ব্যালেন্স</span><span class="pill">ID : ${esc(state.profile.telegram_id)}</span></div><div class="total">🪙 মোট ইনকাম ব্যালেন্স</div><div class="amount">${money(state.profile.balance)}</div><div class="balancefoot"><span class="username">👤 ইউজার নাম: <b>${esc(state.profile.first_name||"User")}</b></span><button class="withdraw" onclick="show('withdraw')">💸 উইথড্র করুন</button></div></section><h2 class="section-title"><span class="ico">▰</span> প্রয়োজনীয় মেনু</h2><div class="menu"><button class="menu-btn" onclick="show('gmail')"><div class="hex"><div class="hex-icon">✉</div><div class="hex-label">জিমেইল</div></div></button><button class="menu-btn" onclick="show('ads')"><div class="hex"><div class="hex-icon">▣</div><div class="hex-label">এড দেখুন</div></div></button><button class="menu-btn" onclick="show('microjob')"><div class="hex"><div class="hex-icon">☷</div><div class="hex-label">নতুন টাস্ক</div></div></button><button class="menu-btn" onclick="show('history')"><div class="hex"><div class="hex-icon">◔</div><div class="hex-label">হিস্টরি</div></div></button><button class="menu-btn" onclick="show('ref')"><div class="hex"><div class="hex-icon">♟</div><div class="hex-label">রেফার</div></div></button><button class="menu-btn" onclick="support()"><div class="hex"><div class="hex-icon">♧</div><div class="hex-label">সাপোর্ট</div></div></button></div><section class="ref-card"><div class="ref-title">🎁 রেফার প্রোগ্রাম অফার</div><div class="ref-line"><span class="check">✓</span>প্রতি রেফারে পাবেন: <b>${money(state.settings.referral_reward??4)}</b></div><div class="ref-line"><span class="check">✓</span>উইথড্র থেকে আজীবন কমিশন সুবিধা ✅</div><div class="linkbox"><input id="homeRefLink" value="${esc(link)}" readonly><button class="copy" onclick="copyRef()">▣ কপি</button></div></section>`}
async function copyRef(){const el=document.getElementById("homeRefLink");try{await navigator.clipboard.writeText(el.value);alert("Referral link copied")}catch(e){el.select();document.execCommand("copy");alert("Referral link copied")}}
function microjob(){document.getElementById("app").innerHTML=`<h2 class="section-title">📋 নতুন টাস্ক</h2><div class="notice">Admin যোগ করা active task এখানে দেখাবে। প্রতিটি task-এর proof instruction মেনে submission দিন।</div>${state.tasks.length?state.tasks.map(t=>`<div class="card"><b>${esc(t.title)}</b><div class="reward">💰 ${money(t.reward)}</div><div class="desc">${esc(t.description)}</div><button class="primary" style="margin-top:13px" onclick="openTask('${t.id}')">কাজ শুরু করুন</button></div>`).join(""):'<div class="card empty">বর্তমানে কোনো নতুন টাস্ক নেই।</div>'}`}
function openTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;document.getElementById("app").innerHTML=`<div class="card"><h2>${esc(t.title)}</h2><div class="reward">💰 ${money(t.reward)}</div><p class="desc">${esc(t.description)}</p><div class="notice">${esc(t.proof_instruction||"কাজের প্রমাণ দিন।")}</div><div class="form"><label>প্রমাণ</label><textarea id="proof" placeholder="Proof / report"></textarea><button class="primary" onclick="submitTask('${t.id}')">📤 Submit</button></div></div>`}
async function submitTask(id){const proof=document.getElementById("proof").value.trim();if(!proof)return alert("প্রমাণ দিন।");const t=state.tasks.find(x=>x.id===id);const r=await db.from("task_submissions").insert({task_id:id,user_id:state.profile.id,proof_text:proof,status:"pending",reward_snapshot:t.reward});if(r.error)return alert(r.error.message);alert("Submission পাঠানো হয়েছে। Admin approve করলে reward যোগ হবে।");await loadSubs();show("history")}
function historyPage(){document.getElementById("app").innerHTML=`<h2 class="section-title">🕘 কাজের হিস্টরি</h2><div class="statrow"><div class="stat">মোট<b>${state.subs.length}</b></div><div class="stat">Approved<b>${state.subs.filter(x=>x.status==="approved").length}</b></div><div class="stat">Pending<b>${state.subs.filter(x=>x.status==="pending").length}</b></div></div>${state.subs.map(s=>`<div class="card"><b>${esc(s.tasks?.title||"Task")}</b><p>${new Date(s.created_at).toLocaleString("bn-BD")}</p><span class="tag">${esc(s.status)}</span><strong style="float:right">${money(s.reward_snapshot)}</strong></div>`).join("")||'<div class="empty">কোনো history নেই।</div>'}`}
function gmail(){const reward=state.settings.gmail_task_reward??15;document.getElementById("app").innerHTML=`<h2 class="section-title">✉️ Gmail</h2><div class="card"><h2>Gmail Verification</h2><div class="reward">Rate: ${money(reward)}</div><p class="desc">নিজের Gmail-এর মালিকানা/verification সম্পর্কিত বৈধ task সম্পন্ন করুন।</p><div class="notice">🔒 Gmail password বা account credential এখানে দেবেন না। Verification code/link বা non-sensitive proof ব্যবহার করুন।</div><button class="primary" onclick="show('microjob')">Gmail Task দেখুন</button></div>`}
function ads(){const r=state.settings.ad_reward??0.10,l=state.settings.daily_ad_limit??100;document.getElementById("app").innerHTML=`<h2 class="section-title">📺 Ads Watch</h2><div class="adbox"><div style="font-size:50px">📺</div><h2>বিজ্ঞাপন দেখে আয় করুন</h2><div class="adreward">${money(r)}</div><p>প্রতি verified ad</p><p>আজকের limit: ${l}</p><button class="primary" onclick="alert('Rewarded ad provider এখনো যুক্ত করা হয়নি। Verified callback ছাড়া balance credit হবে না।')">▶️ Start Ad</button></div>`}
function referral(){const code=state.profile.referral_code||"";const link="https://t.me/moneymaker_bot?startapp=ref_"+code;document.getElementById("app").innerHTML=`<h2 class="section-title">👥 Referral</h2><div class="card"><h3>আপনার Referral Link</h3><input value="${esc(link)}" readonly style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px"><p class="desc">Qualifying task সম্পন্ন হলে referral commission প্রযোজ্য হবে।</p><button class="primary" onclick="navigator.clipboard?.writeText('${esc(link)}');alert('Link copied')">কপি করুন</button></div>`}
function withdrawPage(){const min=state.settings.minimum_withdraw??250;document.getElementById("app").innerHTML=`<h2 class="section-title">💸 Withdraw</h2><div class="card"><p>Minimum withdrawal: <b>${money(min)}</b></p><div class="form"><label>Amount</label><input id="wa" type="number" min="${min}" step="0.01"><label>Payment Method</label><select id="wm"><option>bKash</option><option>Nagad</option><option>Rocket</option></select><label>Payment Number</label><input id="wn" inputmode="numeric" placeholder="01XXXXXXXXX"><button class="primary" onclick="requestWithdraw()">Request Withdraw</button></div></div>`}
async function requestWithdraw(){const amount=Number(document.getElementById("wa").value),min=Number(state.settings.minimum_withdraw??250);if(amount<min)return alert("Minimum withdrawal "+money(min));if(amount>Number(state.profile.balance))return alert("Insufficient balance");const r=await db.from("withdrawals").insert({user_id:state.profile.id,amount,payment_method:document.getElementById("wm").value,payment_number:document.getElementById("wn").value.trim(),status:"pending"});if(r.error)return alert(r.error.message);alert("Withdrawal request পাঠানো হয়েছে।")}
function profile(){document.getElementById("app").innerHTML=`<h2 class="section-title">👤 My Profile</h2><div class="card"><b>${esc(state.profile.first_name||"User")}</b><p>Telegram ID: ${esc(state.profile.telegram_id)}</p><p>Balance: ${money(state.profile.balance)}</p></div>`}function support(){alert("Support username/URL admin configuration অনুযায়ী এখানে বসবে.")}boot();
</script>
</body></html>
