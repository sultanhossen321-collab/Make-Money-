<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Service</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}.app{max-width:480px;margin:auto;min-height:100vh;padding:18px 14px 30px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #0001}.muted{color:#74808b;font-size:14px}.balance{font-size:30px;font-weight:700;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:600;background:#e9f2ff;color:#1769aa;cursor:pointer}button.primary{background:#1683e8;color:white}.full{grid-column:1/-1}#msg{margin-top:12px;color:#555;font-size:14px;text-align:center}</style></head><body><div class="app"><div class="card"><div class="muted">👋 Welcome</div><h2 id="name">User</h2><div class="muted">আপনার বর্তমান ব্যালেন্স</div><div class="balance">৳ <span id="balance">0.00</span></div></div><div class="grid"><button class="primary" onclick="show('📧 Email Service')">📧 Email Service</button><button onclick="show('💸 Withdraw')">💸 Withdraw</button><button onclick="show('💰 My Balance')">💰 My Balance</button><button onclick="show('📜 History')">📜 History</button><button onclick="show('🎁 Referral')">🎁 Referral</button><button onclick="show('☎️ Help')">☎️ Help</button></div><div id="msg"></div></div><script>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}if(tg?.initDataUnsafe?.user)document.getElementById('name').textContent=tg.initDataUnsafe.user.first_name||'User';function show(t){document.getElementById('msg').textContent=t+' — এই ফিচারটি পরের ধাপে যুক্ত করা হবে।'}</script></body></html>
